#:schema https://brimble.io/schema/brimble.json

# GiftMe on Brimble, next to its Blnk Core (blnk/brimble/README.md).
# No disk is kept between deploys, so the data lives in Turso (DATABASE_URL) and photos are
# stored in that same database (IMAGE_STORE=database).

[services.giftme]
type = "web"
region = "eu-central"

[services.giftme.build]
install = "npm ci --include=dev"
command = "npm run build"
runtime = { node = "22" }

[services.giftme.deploy]
start = "npm start"
port = 3000
health = "/"

[services.giftme.resources]
cpu = 0.5
memory = "1gb"

[services.giftme.env]
NODE_ENV = "production"
PUBLIC_SITE_URL = "https://giftme.website"
IMAGE_STORE = "database"
BLNK_URL = "https://giftme-blnk-blnk-test.brimble.app"
USD_NGN_RATE = "1500"
PLATFORM_FEE_PERCENT = "0"
VITE_REPO_URL = "https://github.com/ubcodes/giftme"

# Set these in the Brimble dashboard (Environment variables), never in this file.
[services.giftme.secrets]
required = ["DATABASE_URL", "DATABASE_AUTH_TOKEN", "BLNK_SECRET_KEY", "PAYSTACK_SECRET_KEY", "CLERK_PUBLISHABLE_KEY", "CLERK_SECRET_KEY", "ADMIN_EMAILS"]

[services.giftme.network]
domains = ["giftme.website", "www.giftme.website"]
