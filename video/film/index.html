<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>GiftMe launch film</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bilbo&family=Belleza&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet" />
<style>html,body{margin:0;background:#f7f3ee}canvas{display:block;max-width:100vw;height:auto}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import { create3D } from './gifts3d.js'
import { spring, track, clamp, prog, ease, rng, rrect, loadImages } from './motion.js'
import { SCENES, DUR, W as BW, H as BH } from './timeline.js'

const q = new URLSearchParams(location.search)
const W = +q.get('w') || BW, H = +q.get('h') || BH
const c = document.getElementById('c'); c.width = W; c.height = H
let g = c.getContext('2d')
const K = W / 1920 // everything is laid out on a 1920-wide grid

const BG = '#f7f3ee', INK = '#1c1917', MUTED = '#78716c', ACCENT = '#a855f7', PINK = '#ec4899'
const DISPLAY = '"Cormorant Garamond"', BODY = 'Belleza', SCRIPT = 'Bilbo'

let IMG, BOX, NOISE, PAGE_BG = '#fafafa', GL
window.ready = (async () => {
  await Promise.all([
    document.fonts.load(`500 100px ${DISPLAY}`), document.fonts.load(`400 100px ${DISPLAY}`),
    document.fonts.load(`italic 400 100px ${DISPLAY}`), document.fonts.load(`100px ${BODY}`), document.fonts.load(`100px ${SCRIPT}`),
  ])
  BOX = await (await fetch('../assets/boxes.json')).json()
  GL = create3D(W, H)
  const PHOTOS = ['couple', 'mixer', 'camera', 'headphones', 'beach', 'pour-over', 'sneakers']
  const SCREENS = ['owner-full', 'owner-add-dialog', 'dash-full', 'phone-full', 'phone-give-0', 'phone-give-1', 'friends-full', 'friends-search']
  IMG = await loadImages(Object.fromEntries([...SCREENS.map((n) => [n, `../assets/${n}.png`]), ...PHOTOS.map((n) => [n, `../assets/${n}.jpg`])]))
  // Film grain, made once from seeded noise.
  NOISE = document.createElement('canvas'); NOISE.width = NOISE.height = 256
  const nx = NOISE.getContext('2d'), id = nx.createImageData(256, 256), r = rng(9)
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  nx.putImageData(id, 0, 0)
  // The page's own background, sampled from an empty spot of the capture.
  const s = document.createElement('canvas'); s.width = s.height = 1
  s.getContext('2d').drawImage(IMG['owner-full'], 2700, 2300, 1, 1, 0, 0, 1, 1)
  const p = s.getContext('2d').getImageData(0, 0, 1, 1).data
  PAGE_BG = `rgb(${p[0]},${p[1]},${p[2]})`
})()

// ---------------------------------------------------------------- drawing helpers

const font = (px, fam, weight = '400', style = '') => `${style} ${weight} ${px}px ${fam}`
function text(str, x, y, { size = 40, fam = BODY, color = INK, align = 'left', base = 'alphabetic', alpha = 1, weight = '400', style = '' } = {}) {
  if (alpha <= 0) return
  g.save(); g.globalAlpha *= alpha; g.font = font(size, fam, weight, style); g.fillStyle = color
  g.textAlign = align; g.textBaseline = base; g.fillText(str, x, y); g.restore()
}
const measure = (str, size, fam, weight = '400', style = '') => { g.font = font(size, fam, weight, style); return g.measureText(str).width }

function shadow(blur, oy, a) { g.shadowColor = `rgba(40,20,60,${a})`; g.shadowBlur = blur; g.shadowOffsetY = oy; g.shadowOffsetX = 0 }
function noShadow() { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0 }
function card(x, y, w, h, r, fill = '#fff', sh = [40, 18, 0.16]) {
  g.save(); if (sh) shadow(...sh); rrect(g, x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore()
}
/** Draw part of a 2x capture: box in CSS px, placed at (x, y) with s screen px per CSS px. */
function crop(img, b, x, y, s, r = 0, alpha = 1) {
  if (alpha <= 0) return
  g.save(); g.globalAlpha *= alpha
  if (r) { rrect(g, x, y, b.w * s, b.h * s, r); g.clip() }
  g.drawImage(IMG[img], b.x * 2, b.y * 2, b.w * 2, b.h * 2, x, y, b.w * s, b.h * s)
  g.restore()
}
function photo(name, x, y, w, h, r = 0, pos = 0.5) {
  const im = IMG[name], ar = w / h, iar = im.width / im.height
  let sw = im.width, sh = im.height, sx = 0, sy = 0
  if (iar > ar) { sw = sh * ar; sx = (im.width - sw) * pos } else { sh = sw / ar; sy = (im.height - sh) * pos }
  g.save(); if (r) { rrect(g, x, y, w, h, r); g.clip() }
  g.drawImage(im, sx, sy, sw, sh, x, y, w, h); g.restore()
}
function mixColor(hex, f) { // f > 0 lightens toward white, f < 0 darkens
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255
  const t = f > 0 ? 255 : 0, a = Math.abs(f)
  r = Math.round(r + (t - r) * a); gg = Math.round(gg + (t - gg) * a); b = Math.round(b + (t - b) * a)
  return `rgb(${r},${gg},${b})`
}
function cursor(x, y, name, color = ACCENT, press = 0, alpha = 1) {
  if (alpha <= 0) return
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.scale(1 - press * 0.15, 1 - press * 0.15)
  if (press > 0) { g.beginPath(); g.arc(0, 0, 14 + press * 26, 0, Math.PI * 2); g.fillStyle = `rgba(168,85,247,${0.28 * press})`; g.fill() }
  shadow(8, 3, 0.3)
  g.beginPath(); g.moveTo(0, 0); g.lineTo(9.5, 27); g.lineTo(13.5, 15.5); g.lineTo(26, 13); g.closePath()
  g.fillStyle = color; g.fill(); noShadow(); g.lineWidth = 2.2; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.stroke()
  g.font = font(19, BODY); const tw = g.measureText(name).width
  rrect(g, 20, 26, tw + 22, 30, 15); g.fillStyle = color; g.fill()
  g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(name, 31, 41.5)
  g.restore()
}
function tap(x, y, t, name) { // a finger tap on a phone: ring that grows and fades
  if (t < -0.35 || t > 0.6) return
  const p = prog(t, 0, 0.45)
  g.save()
  if (t >= 0) { g.beginPath(); g.arc(x, y, 18 + p * 40, 0, Math.PI * 2); g.strokeStyle = `rgba(236,72,153,${0.6 * (1 - p)})`; g.lineWidth = 4; g.stroke() }
  g.beginPath(); g.arc(x, y, 22 * (t < 0 ? spring(t + 0.35, 300, 22) : 1 - 0.25 * Math.sin(Math.min(1, t / 0.2) * Math.PI)), 0, Math.PI * 2)
  g.fillStyle = `rgba(236,72,153,${0.35 * (1 - prog(t, 0.3, 0.6))})`; g.fill()
  if (name) { g.globalAlpha = 1 - prog(t, 0.35, 0.6); g.font = font(18, BODY); const tw = g.measureText(name).width; rrect(g, x + 24, y + 18, tw + 20, 28, 14); g.fillStyle = PINK; g.fill(); g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(name, x + 34, y + 32.5) }
  g.restore()
}
const at = (t, way) => { // waypoints [{t, x, y}] with eased travel of 0.4s into each point
  let x = way[0].x, y = way[0].y
  for (let i = 1; i < way.length; i++) { const p = ease.inOutCubic((t - (way[i].t - (way[i].d ?? 0.4))) / (way[i].d ?? 0.4)); x += (way[i].x - way[i - 1].x) * p; y += (way[i].y - way[i - 1].y) * p }
  return { x, y }
}
const press = (t, t0) => (t > t0 && t < t0 + 0.22 ? Math.sin(((t - t0) / 0.22) * Math.PI) : 0)

/** Letters spring up into place; leave() sends them up and out. */
function kinetic(str, x, y, t, { size = 180, fam = DISPLAY, color = INK, weight = '500', style = '', align = 'left', stagger = 0.028, out = 99, k = 240, d = 20, rise = 0.55 } = {}) {
  if (t < 0 || t > out + 0.5) return 0
  g.save(); g.font = font(size, fam, weight, style); g.fillStyle = color; g.textBaseline = 'alphabetic'
  const total = g.measureText(str).width
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], w = g.measureText(str.slice(0, i + 1)).width - g.measureText(str.slice(0, i)).width
    const s = spring(t - i * stagger, k, d), o = prog(t, out + i * 0.012, out + 0.18 + i * 0.012)
    g.save(); g.globalAlpha *= clamp(s * 2.5) * (1 - o)
    g.translate(cx + w / 2, y + (1 - s) * size * rise - o * size * 0.5); g.rotate((1 - s) * 0.12)
    g.fillText(ch, -w / 2, 0); g.restore(); cx += w
  }
  g.restore()
  return total
}
/** A line of words, each appearing at its own time. words: [[text, t0, opts?]] */
function words(list, x, y, t, base, align = 'left') {
  g.save()
  const widths = list.map(([w, , o]) => measure(w, (o ?? base).size, (o ?? base).fam ?? base.fam, (o ?? base).weight ?? base.weight, (o ?? base).style ?? ''))
  const gap = base.size * 0.26, total = widths.reduce((a, b) => a + b, 0) + gap * (list.length - 1)
  let cx = align === 'center' ? x - total / 2 : x
  list.forEach(([w, t0, o], i) => { kinetic(w, cx, y, t - t0, { ...base, ...(o ?? {}), stagger: 0.02 }); cx += widths[i] + gap })
  g.restore()
}

// ---------------------------------------------------------------- 3D gifts and items (see gifts3d.js)

/** Soft contact shadow: a radial gradient squashed into an ellipse (much cheaper than a blur filter). */
function contactShadow(x, y, w, lift = 0, k = 1) {
  const a = clamp(0.26 - lift / 2000), rx2 = w * 0.68 * k * (1 + lift / 1500), ry2 = w * 0.15 * k
  if (a <= 0) return
  g.save(); g.translate(x, y + 6 * k); g.scale(1, ry2 / rx2)
  const sg = g.createRadialGradient(0, 0, 0, 0, 0, rx2); sg.addColorStop(0, `rgba(60,30,80,${a})`); sg.addColorStop(0.6, `rgba(60,30,80,${a * 0.5})`); sg.addColorStop(1, 'rgba(60,30,80,0)')
  g.fillStyle = sg; g.beginPath(); g.arc(0, 0, rx2, 0, Math.PI * 2); g.fill(); g.restore()
}

// Real 3D objects (gifts3d.js) are queued in screen space and drawn as one layer by flush3D().
const QUEUE = []
function queue3D(o) {
  const m = g.getTransform(), sc = Math.hypot(m.a, m.b)
  QUEUE.push({ ...o, sx: m.a * o.x + m.c * o.y + m.e, sy: m.b * o.x + m.d * o.y + m.f, z: (o.z ?? 0) * sc, size: o.size * sc, alpha: (o.alpha ?? 1) * g.globalAlpha })
}
function flush3D() {
  if (!QUEUE.length) return
  const layer = GL.render(QUEUE.splice(0))
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.drawImage(layer, 0, 0); g.restore()
}

/** The landing hero's gift, in 3D. y is where its bottom sits; open: 0..1 lid flying off. */
function gift({ x, y, z = 0, size = 200, rx = -0.3, ry = 0.6, rz = 0, color = ACCENT, ribbon = '#f9cfe3', open = 0, squash = 0, shadowY = null, alpha = 1 }) {
  if (alpha <= 0) return
  if (shadowY !== null) contactShadow(x, shadowY, size, Math.max(0, shadowY - y), 1)
  queue3D({ kind: 'gift', x, y, z, size, rx, ry, rz, color, ribbon, open, squash, alpha })
}
/** A celebration item (cake, balloon, candles, rings, champagne, flowers, bottle, rattle, booties). */
function item(kind, { x, y, z = 0, size = 150, rx = -0.25, ry = 0, rz = 0, variant, alpha = 1, shadowY = null, t }) {
  if (alpha <= 0) return
  if (shadowY !== null) contactShadow(x, shadowY, size * 0.8, Math.max(0, shadowY - y), 1)
  queue3D({ kind, variant, x, y, z, size, rx, ry, rz, alpha, t })
}
const GIFT_COLORS = [['#a855f7', '#f9cfe3'], ['#ec4899', '#fdf2f8'], ['#c4b5fd', '#a855f7'], ['#93c5fd', '#ffffff'], ['#f9a8d4', '#a855f7'], ['#7c3aed', '#f9cfe3'], ['#fde68a', '#ec4899']]

/** Thrown object with gravity that bounces on a floor, closed form. */
function ballistic(t, y0, vy, grav, floor, rest = 0.32) {
  let y = y0, v = vy, tt = t
  for (let b = 0; b < 4; b++) {
    // time to hit floor: y + v t + g t^2 / 2 = floor
    const disc = v * v + 2 * grav * (floor - y), th = (-v + Math.sqrt(Math.max(0, disc))) / grav
    if (tt < th) return { y: y + v * tt + 0.5 * grav * tt * tt, landed: b > 0, hits: b }
    tt -= th; y = floor; v = -(v + grav * th) * rest
    if (Math.abs(v) < 60) return { y: floor, landed: true, hits: b + 1 }
  }
  return { y: floor, landed: true, hits: 4 }
}

// ---------------------------------------------------------------- shared pieces

function background(t) {
  g.fillStyle = BG; g.fillRect(0, 0, 1920, 1080)
  // A faint version of the site's aurora: purple, pink and blue light drifting behind everything.
  for (const [col, x, y, r, a, ph] of [['192,132,252', 380, 110, 980, 0.1, 0], ['249,168,212', 1620, 170, 900, 0.085, 2.1], ['147,197,253', 1060, 1080, 1050, 0.075, 4.2]]) {
    const cx = x + Math.sin(t * 0.16 + ph) * 70, cy = y + Math.cos(t * 0.12 + ph) * 45
    g.save(); g.translate(cx, cy); g.scale(1.35, 0.8)
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.55, `rgba(${col},${a * 0.45})`); gr.addColorStop(1, `rgba(${col},0)`)
    g.fillStyle = gr; g.fillRect(-r, -r, r * 2, r * 2); g.restore()
  }
}
function grain(t) {
  g.save(); g.globalAlpha = 0.045; g.globalCompositeOperation = 'overlay'
  const r = rng(Math.floor(t * 24) + 1), ox = Math.floor(r() * 256), oy = Math.floor(r() * 256)
  const pat = g.createPattern(NOISE, 'repeat'); g.translate(-ox, -oy); g.fillStyle = pat; g.fillRect(0, 0, W + 256, H + 256)
  g.restore()
}
function caption(lines, x, y, t, out = 99) {
  // Big kinetic words with a soft cream backing so they read over UI.
  let yy = y
  for (const [str, t0, opts = {}] of lines) {
    const size = opts.size ?? 96
    const w = measure(str, size, opts.fam ?? DISPLAY, opts.weight ?? '500')
    const a = clamp((t - t0) * 6) * (1 - prog(t, out, out + 0.2))
    if (a > 0) {
      const ew = w / 2 + 90, eh = size * 0.8
      g.save(); g.globalAlpha = a * 0.92; g.translate(x + w / 2, yy - size * 0.32); g.scale(1, eh / ew)
      const cg = g.createRadialGradient(0, 0, 0, 0, 0, ew); cg.addColorStop(0, BG); cg.addColorStop(0.7, BG); cg.addColorStop(1, 'rgba(247,243,238,0)')
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, ew, 0, Math.PI * 2); g.fill(); g.restore()
    }
    kinetic(str, x, yy, t - t0, { size, fam: opts.fam ?? DISPLAY, color: opts.color ?? INK, weight: opts.weight ?? '500', out: out - t0 })
    const next = lines[lines.indexOf(lines.find((l) => l[0] === str)) + 1]
    yy += opts.lead ?? size * 0.45 + (next ? next[2]?.size ?? 96 : 96) * 0.62
  }
}
function browserWindow(x, y, w, h, url, alpha = 1) {
  g.save(); g.globalAlpha *= alpha
  card(x, y, w, h, 22, '#ffffff', [80, 40, 0.22])
  g.save(); rrect(g, x, y, w, 52, 22); g.clip(); g.fillStyle = '#f5f3f1'; g.fillRect(x, y, w, 52); g.restore()
  ;['#f87171', '#fbbf24', '#34d399'].forEach((col, i) => { g.beginPath(); g.arc(x + 30 + i * 22, y + 26, 7, 0, Math.PI * 2); g.fillStyle = col; g.fill() })
  const uw = Math.min(520, w * 0.45); rrect(g, x + w / 2 - uw / 2, y + 12, uw, 28, 14); g.fillStyle = '#ebe7e3'; g.fill()
  text(url, x + w / 2, y + 31, { size: 17, color: '#78716c', align: 'center' })
  g.restore()
}
const BAR = 52

// The owner's wishlist page, as it sits in a browser window. css → screen.
function pageView(win, cssX0, scroll, s) {
  return {
    x: (cx) => win.x + (cx - cssX0) * s,
    y: (cy) => win.y + BAR + (cy - scroll) * s,
    clip() { rrect(g, win.x, win.y + BAR, win.w, win.h - BAR, 0); g.save(); g.beginPath(); g.rect(win.x, win.y + BAR, win.w, win.h - BAR - 22); g.clip() },
  }
}

// ---------------------------------------------------------------- S1: the gift drop

function sDrop(t) {
  const floor = 860, X = 1300
  // Hero gift: already falling on frame one, lands on the first beat.
  const fall = clamp(t / 0.5), landed = t >= 0.5
  const y = landed ? floor : 120 + (floor - 120) * fall * fall
  const u = t - 0.5
  const squash = landed ? 0.22 * Math.exp(-7 * u) * Math.cos(16 * u) : -0.06 * fall
  const open = spring(t - 1.0, 60, 9) * clamp((t - 1.0) * 3)
  const exitT = prog(t, 4.15, 4.5)
  g.save(); g.translate(0, -ease.inQuad(exitT) * 1300)

  // Out of the open box, what each word is about: birthday, then wedding, then baby shower.
  const mouth = floor - 280
  const WAVES = [
    [1.02, [['cake', 'land', 250, { lx: 960 }], ['balloon', 'float', 230, { dx: -150, variant: '#ec4899' }], ['balloon', 'float', 205, { dx: 170, variant: '#a855f7', d: 0.12 }], ['candles', 'camera', 170, { dx: -620, d: 0.06 }]]],
    [2.08, [['champagne', 'land', 200, { lx: 1660 }], ['flowers', 'camera', 220, { dx: -460, d: 0.05, rx: -0.75 }], ['rings', 'float', 230, { dx: 40, d: 0.1 }]]],
    [3.27, [['booties', 'land', 210, { lx: 1130, lz: -200 }], ['bottle', 'float', 180, { dx: -110, d: 0.08 }], ['rattle', 'camera', 190, { dx: 560, d: 0.04 }]]],
  ]
  const front = []
  WAVES.forEach(([w0, list]) => list.forEach(([kind, path, size, o], i) => {
    const tt = t - w0 - (o.d ?? 0); if (tt < 0) return
    const spin = 0.5 + i * 0.7
    if (path === 'land') {
      const T = 0.78, lz = o.lz ?? 0, landY = floor + 8 - lz * 0.12
      const b = ballistic(tt, mouth, -1000, 3600, landY, 0.25)
      const x = X + (o.lx - X) * ease.outCubic(Math.min(1, tt / T))
      item(kind, { x, y: b.y, z: lz * Math.min(1, tt / T), size, ry: spin + (b.landed ? 0.6 : tt * 1.4), rx: -0.22, rz: b.landed ? 0 : Math.sin(tt * 6) * 0.15, shadowY: landY, t, variant: o.variant })
    } else if (path === 'float') {
      const y = mouth - (520 * tt + 260 * tt * tt), x = X + o.dx * Math.min(1, tt * 1.4) + Math.sin(tt * 2.4 + i) * 22
      item(kind, { x, y, size: size * (0.55 + 0.45 * spring(tt, 200, 18)), ry: spin + tt * 1.6, rx: -0.15, rz: Math.sin(tt * 2 + i) * 0.12, t, variant: o.variant })
    } else {
      // toward the camera: grows, spreads away from the centre, and fades before it fills the frame
      const z = -1150 * ease.inQuad(Math.min(1, tt / 1.15)), k = 2015 / (2015 + z)
      let x = X + o.dx * ease.outCubic(Math.min(1, tt / 1.1)), y = mouth - 380 * Math.sin(Math.min(1, tt / 0.9) * Math.PI * 0.6)
      x = 960 + (x - 960) * k; y = 540 + (y - 540) * k
      front.push(() => item(kind, { x, y, z, size, ry: spin + tt * 3, rx: o.rx ?? -0.3 + tt * 1.2, rz: o.rx ? 0.15 : tt * 0.8, alpha: 1 - prog(k, 1.9, 2.5), t, variant: o.variant }))
    }
  }))
  gift({ x: X, y, size: 330, ry: 0.55 + t * 0.18, rx: -0.33, rz: landed ? 0 : 0.1 * (1 - fall), squash, open, shadowY: floor })
  front.forEach((f) => f())
  flush3D()
  g.restore()

  // The words, on the voice.
  const L = [['Birthdays.', 0.75, 1.95], ['Weddings.', 2.06, 3.13], ['Baby showers.', 3.25, 4.2]]
  L.forEach(([w, t0, out], i) => kinetic(w, 130, 560, t - t0, { size: i === 2 ? 168 : 196, out: out - t0, color: INK }))
  // A small eyebrow that stays
  text('FOR EVERY CELEBRATION', 138, 360, { size: 30, color: MUTED, alpha: clamp((t - 0.6) * 3) * (1 - exitT) })
}

// ---------------------------------------------------------------- S2: everyone asks

const BUBBLES = [
  ['Aunty Ngozi', 'What should I get you two? 🎁', 160, 170, '#7c3aed'],
  ['Tunde', 'Abeg send your wishlist 🙏', 1180, 140, '#0ea5e9'],
  ['Kemi', 'Should I just do cash? 😅', 1260, 520, '#db2777'],
  ['Ife', 'Account number please 😂', 120, 610, '#059669'],
  ['Dami', 'Is the blender still available??', 640, 850, '#d97706'],
  ['Bayo', 'Don’t let me buy the same thing as Tunde o', 980, 330, '#4f46e5'],
  ['Chioma', 'What do you even want sef 🤔', 230, 900, '#e11d48'],
]
function bubble(name, msg, x, y, col, s, alpha, tilt) {
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.rotate(tilt); g.scale(s, s)
  const tw = measure(msg, 34, BODY), w = tw + 130, h = 104
  card(0, 0, w, h, 30, '#ffffff', [30, 14, 0.14])
  g.beginPath(); g.moveTo(26, h - 2); g.lineTo(6, h + 18); g.lineTo(54, h - 2); g.fillStyle = '#fff'; g.fill()
  g.beginPath(); g.arc(52, 52, 30, 0, Math.PI * 2); g.fillStyle = mixColor(col, 0.82); g.fill()

// Each bubble is drawn once into its own canvas; depth of field = drawing it through a smaller
// copy (cheap), never a blur filter (seconds per frame in software rendering).
const SPRITES = new Map()
function bubbleSprite(i, level) {
  const key = i + ':' + level
  if (SPRITES.has(key)) return SPRITES.get(key)
  const [name, msg, , , col] = BUBBLES[i]
  let cv
  if (level === 0) {
    const tw = measure(msg, 34, BODY), w = tw + 130 + 80, h = 104 + 80
    cv = document.createElement('canvas'); cv.width = w * 2; cv.height = h * 2
    const prev = g; const cx = cv.getContext('2d'); cx.scale(2, 2); cx.translate(40, 30)
    swapContext(cx, () => bubble(name, msg, 0, 0, col, 1, 1, 0)); void prev
  } else {
    const base = bubbleSprite(i, 0), f = 1 / (1 + level * 1.4)
    const small = document.createElement('canvas'); small.width = Math.max(1, base.width * f); small.height = Math.max(1, base.height * f)
    const sx = small.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(base, 0, 0, small.width, small.height)
    cv = document.createElement('canvas'); cv.width = base.width; cv.height = base.height
    const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(small, 0, 0, cv.width, cv.height)
  }
  SPRITES.set(key, cv)
  return cv
}
function swapContext(cx, fn) { const keep = g; g = cx; try { fn() } finally { g = keep } }

function sChaos(t) {
  const blurOut = prog(t, 2.05, 2.45)
  const pull = Math.pow(prog(t, 3.55, 4.0), 2.2)
  const cx = 960, cy = 540
  BUBBLES.forEach(([name, msg, x, y, col], i) => {
    const t0 = i * 0.25, s = spring(t - t0, 260, 17)
    if (t < t0) return
    const drift = Math.sin(t * 1.3 + i) * 6
    const depth = 1 - blurOut * 0.12
    const bx = x + (cx - x) * pull, by = y + drift + (cy - y) * pull
    const sp = bubbleSprite(i, Math.round(blurOut * 5)), sc = (0.6 + 0.4 * s) * depth * (1 - pull)
    g.save(); g.globalAlpha = clamp(s * 3) * (1 - blurOut * 0.6)
    g.translate(bx, by); g.rotate((i % 2 ? -1 : 1) * 0.035 * (1 + (1 - s) * 3)); g.scale(sc / 2, sc / 2)
    g.drawImage(sp, -80, -60); g.restore()
  })
  // The question, word by word on the voice.
  g.save(); const zp = 1 - pull; g.translate(cx, cy); g.scale(zp, zp); g.translate(-cx, -cy); g.globalAlpha = 1 - pull
  words([['So', 2.22], ['what', 2.38], ['do', 2.55], ['you', 2.68]], 960, 500, t, { size: 150, fam: DISPLAY, weight: '500' }, 'center')
  words([['actually', 2.9, { fam: SCRIPT, size: 210, color: ACCENT, weight: '400' }], ['want?', 3.32]], 960, 690, t, { size: 150, fam: DISPLAY, weight: '500' }, 'center')
  g.restore()
  if (pull > 0.6) gift({ x: cx, y: cy + 60, size: 120 * prog(t, 3.7, 4.0), ry: t * 3, color: ACCENT })
  flush3D()
}
